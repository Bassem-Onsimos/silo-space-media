<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Viewport test</title>
<style>
  html, body { margin: 0; background: #f0efe9; font: 600 17px/1.35 -apple-system, sans-serif; color: #111; }
  #hero { height: 100svh; background: linear-gradient(#335, #113); color: #fff; position: relative; }
  #hero::after { content: 'hero bottom (100svh)'; position: absolute; left: 0; right: 0; bottom: 0; border-bottom: 4px solid #ff0; font-size: 12px; text-align: right; padding-right: 8px; }
  #vals { position: absolute; top: 70px; left: 16px; right: 16px; font-size: 19px; }
  #vals b { display: inline-block; min-width: 130px; }
  .probe { position: absolute; top: 0; left: -10px; width: 1px; visibility: hidden; }
  #strip { position: fixed; left: 0; right: 0; bottom: 0; height: calc(100lvh - 100svh); background: rgba(0, 160, 255, 0.85); }
  @supports (animation-timeline: scroll()) { .fade #strip { animation: f linear both; animation-timeline: scroll(); animation-range: 0 120px; } }
  @keyframes f { to { opacity: 0; } }
  #bottom { position: fixed; left: 0; width: 40%; bottom: 0; height: 12px; background: #f00; }
  #after { padding: 24px 16px 1200px; }
</style>
</head>
<body>
<div class="probe" id="p-vh" style="height:100vh"></div>
<div class="probe" id="p-svh" style="height:100svh"></div>
<div class="probe" id="p-lvh" style="height:100lvh"></div>
<div class="probe" id="p-dvh" style="height:100dvh"></div>
<div class="probe" id="p-sab" style="height:env(safe-area-inset-bottom,0px)"></div>
<div class="probe" id="p-sat" style="height:env(safe-area-inset-top,0px)"></div>
<section id="hero"><div id="vals"></div></section>
<div id="strip"></div><div id="bottom"></div>
<div id="after">Section after the hero. Blue = strip (100lvh − 100svh, fixed bottom). Red = fixed bottom:0, 12px. Yellow line = hero bottom.</div>
<script>
  // options: ?h=2 (strip height in px), ?c=000 (strip colour), ?fade=1 (fade out over the first 120px), ?red=0 (hide red bar)
  const q = new URLSearchParams(location.search), strip = document.getElementById('strip');
  if (q.has('h')) strip.style.height = q.get('h') + 'px';
  if (q.has('c')) strip.style.background = '#' + q.get('c');
  if (q.get('fade') === '1') document.documentElement.classList.add('fade');
  if (q.get('red') === '0') document.getElementById('bottom').style.display = 'none';
  const h = (id) => document.getElementById(id).getBoundingClientRect().height.toFixed(1);
  function show() {
    const vv = window.visualViewport;
    const s = document.getElementById('strip').getBoundingClientRect();
    const r = document.getElementById('bottom').getBoundingClientRect();
    document.getElementById('vals').innerHTML = [
      ['innerHeight', innerHeight],
      ['visualVP h', vv ? vv.height.toFixed(1) : '-'],
      ['clientHeight', document.documentElement.clientHeight],
      ['screen.height', screen.height],
      ['100vh', h('p-vh')], ['100svh', h('p-svh')], ['100lvh', h('p-lvh')], ['100dvh', h('p-dvh')],
      ['safe bottom', h('p-sab')], ['safe top', h('p-sat')],
      ['strip top/bot', s.top.toFixed(1) + ' / ' + s.bottom.toFixed(1)],
      ['red top/bot', r.top.toFixed(1) + ' / ' + r.bottom.toFixed(1)],
      ['scrollY', Math.round(scrollY)],
    ].map(([k, v]) => '<b>' + k + '</b> ' + v).join('<br>');
  }
  show();
  addEventListener('resize', show); addEventListener('scroll', show, { passive: true });
  if (window.visualViewport) visualViewport.addEventListener('resize', show);
  setInterval(show, 500);
</script>
</body>
</html>
